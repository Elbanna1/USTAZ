<!doctype html>
<html lang="ar" dir="rtl" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0F332E" />
    <meta name="theme-color" content="#0F332E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1513" media="(prefers-color-scheme: dark)" />

    <title>أستاذ — ابنِ اسمك كمدرّس</title>
    <meta
      name="description"
      content="أستاذ (Ustaz) — منصة مصرية تخلي كل مدرّس عنده موقعه الشخصي: اعرض خبرتك، نظّم مجموعاتك، وصل لطلاب أكتر، وخلي كل تفاصيل شغلك التعليمي في مكان واحد."
    />
    <meta name="author" content="Ustaz" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="أستاذ — Ustaz" />
    <meta property="og:title" content="أستاذ — كل اللي محتاجه عشان تبني اسمك كمدرّس" />
    <meta
      property="og:description"
      content="منصة مصرية للمدرّسين: بروفايل شخصي، مجموعات، كورسات، جداول، واشتراكات — في مكان واحد."
    />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Cairo and Plus Jakarta Sans are variable on Google Fonts, so a weight
      RANGE ships one file per subset instead of one per weight. Only the five
      weights the type scale actually uses are covered (400-800 display,
      400-700 body and Latin); 300 and 900 were downloaded and never set.
      This takes the first-paint font payload from 16 files to 8.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Prevent theme flash: resolve the stored/preferred theme before first paint.
      (function () {
        try {
          var stored = localStorage.getItem('ustaz-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(theme)
          root.style.colorScheme = theme
        } catch (e) {
          /* storage blocked — fall back to the light default already on <html> */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
